<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('')}"></header>
<main class="container">
    <div class="auth" style="max-width:560px">
        <h2 style="margin-top:0">회원가입</h2>
        <form th:action="@{/member/join}" th:object="${form}" method="post">
            <div class="err" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
            <div class="form-row"><span>이메일</span>
                <div><div class="inline"><input id="email" th:field="*{email}" type="email"><button type="button" class="btn line sm" onclick="checkEmail()" style="white-space:nowrap">중복 확인</button></div>
                    <div class="err" id="emailMsg"></div><div class="err" th:errors="*{email}"></div></div></div>
            <div class="form-row"><span>비밀번호</span><div><input th:field="*{password}" type="password" placeholder="8~20자"><div class="err" th:errors="*{password}"></div></div></div>
            <div class="form-row"><span>비밀번호 확인</span><div><input th:field="*{passwordConfirm}" type="password"><div class="err" th:errors="*{passwordConfirm}"></div></div></div>
            <div class="form-row"><span>이름</span><div><input th:field="*{name}"><div class="err" th:errors="*{name}"></div></div></div>
            <div class="form-row"><span>연락처</span><div><input th:field="*{phone}" placeholder="010-0000-0000"><div class="err" th:errors="*{phone}"></div></div></div>
            <div class="form-row"><span>우편번호</span><input th:field="*{zipcode}" style="max-width:160px"></div>
            <div class="form-row"><span>주소</span><input th:field="*{address}"></div>
            <div class="form-row"><span>상세주소</span><input th:field="*{addressDetail}"></div>
            <button class="btn block" type="submit" style="margin-top:12px">가입하기</button>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
