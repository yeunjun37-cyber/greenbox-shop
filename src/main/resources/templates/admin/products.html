<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('상품 관리')}"></head>
<body>
<div class="admin">
    <aside th:replace="~{fragments/layout :: adminSide(${menu})}"></aside>
    <main>
        <th:block th:replace="~{fragments/layout :: flash}"></th:block>
        <div class="toolbar"><h2 style="margin:0">상품 관리</h2>
            <a id="new-prod" class="btn terra" th:href="@{/admin/products/new}">+ 상품 등록</a></div>
        <form class="inline" th:action="@{/admin/products}" method="get" style="margin-bottom:14px;max-width:420px">
            <input name="keyword" th:value="${keyword}" placeholder="상품명 검색"><button class="btn line sm" type="submit">검색</button></form>
        <table class="tbl">
            <tr><th>No</th><th>이미지</th><th>상품명</th><th>카테고리</th><th>가격</th><th>재고</th><th>상태</th><th>관리</th></tr>
            <tr th:each="p : ${page.content}">
                <td th:text="${p.id}"></td>
                <td><span class="mini-thumb"><img th:src="${p.thumbnail}"></span></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.category.name}"></td>
                <td th:text="${#numbers.formatInteger(p.price, 0, 'COMMA')} + '원'"></td>
                <td th:text="${p.stock}" th:style="${p.stock < 10} ? 'color:var(--terra);font-weight:700'"></td>
                <td><span class="tag" th:classappend="${p.status.name() == 'SALE'} ? 'g' : (${p.status.name() == 'SOLDOUT'} ? 't' : '')" th:text="${p.status.label}"></span></td>
                <td class="inline"><a class="btn soft sm" th:href="@{/admin/products/{id}/edit(id=${p.id})}">수정</a>
                    <form th:if="${p.status.name() != 'HIDDEN'}" th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post" onsubmit="return confirm('상품을 숨김 처리할까요?')">
                        <button class="btn line sm" type="submit">삭제</button></form></td>
            </tr>
        </table>
        <div class="pager" th:if="${page.totalPages > 1}">
            <a th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" th:href="@{/admin/products(page=${i},keyword=${keyword})}" th:text="${i + 1}" th:classappend="${i == page.number} ? 'on'"></a>
        </div>
    </main>
</div>
</body>
</html>
