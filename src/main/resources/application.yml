spring:
  profiles:
    active: local
  application:
    name: greenbox-shop
  mvc:
    hiddenmethod:
      filter:
        enabled: true   # PATCH / DELETE 폼 요청 지원
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  jpa:
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  thymeleaf:
    cache: false

app:
  upload-dir: ./uploads

server:
  port: 8080

---
# 로컬 개발용: 별도 DB 설치 없이 H2 메모리 DB(MySQL 모드)로 실행
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:greenbox;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false

---
# 운영/발표용: MySQL 8.0  (실행: --spring.profiles.active=mysql)
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/greenbox?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
